name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Locate the Gradle project
        id: locate
        run: |
          echo "Repo contents:"
          find . -maxdepth 4 -not -path '*/.git*'
          FOUND=$(find . -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          PROJECT_DIR=$(dirname "$FOUND")
          echo "Found settings.gradle in: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle assembleDebug --stacktrace

      - name: Find the built APK
        id: findapk
        run: |
          APK_PATH=$(find . -name "app-debug.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShakeWallpaper-apk
          path: ${{ steps.findapk.outputs.apk_path }}
